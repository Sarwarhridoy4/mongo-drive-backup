run:
  timeout: 5m
  issues-exit-code: 1
  tests: true
  go: "1.26"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - gosec
    - shadow
  disable:
    - funlen
  fast: false

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true
  staticcheck:
    go: "1.26"
  gosec:
    excludes:
      - G104

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
  max-issues-per-linter: 0
  max-same-issues: 0
  new: false

output:
  formats:
    - colored-line-number
  print-issued-lines: true
  print-linter-name: true
